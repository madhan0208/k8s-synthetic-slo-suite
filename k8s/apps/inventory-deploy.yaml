apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: apps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory
          image: inventory-service:1.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "otel-agent.observability:4317"
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: apps
spec:
  selector:
    app: inventory-service
  ports:
    - port: 8081